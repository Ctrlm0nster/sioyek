name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          cd "$RUNNER_TEMP"
          curl --fail --silent --show-error --location --retry 3 \
            --output doxygen-1.18.0.linux.bin.tar.gz \
            https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/doxygen-1.18.0.linux.bin.tar.gz
          echo '14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  doxygen-1.18.0.linux.bin.tar.gz' | sha256sum --check
          tar -xzf doxygen-1.18.0.linux.bin.tar.gz
          sudo install -m 0755 doxygen-1.18.0/bin/doxygen /usr/local/bin/doxygen
          test "$(doxygen --version | cut -d ' ' -f 1)" = "1.18.0"

      - name: Generate Doxygen Documentation
        run: |
          mkdir -p build/doxygen
          doxygen Doxyfile

      - name: Prepare GitHub Pages artifact
        run: |
          touch build/doxygen/html/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/doxygen/html
          force_orphan: true
