name: Deploy Documentation to GitHub Pages

on:
  push:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-24.04
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Doxygen and Graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          if curl -sL https://github.com/doxygen/doxygen/releases/download/Release_1_13_2/doxygen-1.13.2.linux.bin.tar.gz | tar -xz -C /tmp 2>/dev/null; then
            sudo mv /tmp/doxygen-1.13.2/bin/doxygen /usr/local/bin/
          else
            sudo apt-get install -y doxygen
          fi
          doxygen --version

      - name: Generate Doxygen Documentation
        run: |
          mkdir -p build/doxygen
          doxygen Doxyfile

      - name: Prepare GitHub Pages artifact
        run: |
          touch build/doxygen/html/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/doxygen/html
          force_orphan: true
